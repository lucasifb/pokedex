<html>
    <head>
        <style>
            .grid{
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
            
            .cartao{
                position:relative;
                display:flex;
                gap: 30px;
                border: 1px solid gray;
                border-radius: 5px;
                padding:5px;
                font-family:'Segoe UI';
                color:darkolivegreen;
               
            }
            h4{
                position:absolute;
                top: 0px;
                right:0px;
                margin:0 10px;
                color:brown;
            }

        </style>
    </head>
    <body>
            <div class="grid">
        {% for item in numeros %}
            <div class="cartao">
                <img src={{imagens[loop.index0]}} >
                <h4>#{{numeros[loop.index0]}}</h4>
                <h1>{{nomes[loop.index0]}}</h1>
            
            </div>
        {% endfor %}
            </div>
    </body>







</html>
